version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: inference/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_MODEL_REPO=${HF_MODEL_REPO:-AditHash/gemma4-backend-ai-expert}
    env_file:
      - ../.env
    # GPU support (requires nvidia-container-toolkit on host)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
